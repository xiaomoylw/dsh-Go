name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: build apk
        run: |
          cd app
          N=$(python3 -c "import time;print(int(time.time()//60))")
          flutter build apk --release --flavor arm64 --target-platform android-arm64 \
            --build-name 0.6.0 --build-number "$N" \
            --dart-define=DSH_STUN=stun:168.138.212.82:3478 \
            --dart-define=DSH_TURN=turn:168.138.212.82:3478 \
            --dart-define=DSH_TURN_USER=${{ secrets.DSH_TURN_USER }} \
            --dart-define=DSH_TURN_PASS=${{ secrets.DSH_TURN_PASS }}
      - name: locate apk
        if: always()
        run: find . -name '*.apk' -not -path '*/.gradle/*' 2>/dev/null | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-go-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
