name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: versions
        run: flutter --version && java -version
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: build apk release
        id: rel
        continue-on-error: true
        working-directory: app
        run: flutter build apk --release
      - name: build apk debug fallback
        if: steps.rel.outcome == 'failure'
        working-directory: app
        run: flutter build apk --debug
      - name: locate apk files
        run: find . -name '*.apk' -not -path '*/.gradle/*' -printf '%s\t%p\n' || true
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: |
            app/build/**/*.apk
            **/outputs/**/*.apk
          if-no-files-found: warn
