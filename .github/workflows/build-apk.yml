name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: versions
        run: flutter --version && java -version
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: build via official script (release)
        id: rel
        continue-on-error: true
        run: bash tooling/build-apk.sh -f arm64 --release --keep-daemon
      - name: build via official script (debug fallback)
        if: steps.rel.outcome == 'failure'
        run: bash tooling/build-apk.sh -f arm64 --debug --keep-daemon
      - name: locate apk
        if: always()
        run: find . -name '*.apk' -not -path '*/.gradle/*' -printf '%s\t%p\n' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-go-apk
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            **/outputs/**/*.apk
          if-no-files-found: warn
