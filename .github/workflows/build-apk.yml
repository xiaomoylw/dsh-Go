name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: versions
        run: flutter --version && java -version
      - name: pub get
        working-directory: app
        run: flutter pub get
      - name: build apk
        working-directory: app
        run: |
          flutter build apk --release || flutter build apk --debug
      - name: list outputs
        run: ls -lh app/build/app/outputs/flutter-apk/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
